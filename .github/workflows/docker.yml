name: build image

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write         # право публиковать в GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # выдаётся автоматически

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
